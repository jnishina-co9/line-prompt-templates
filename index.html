・添付画像に写っている被写体の特徴(顔立ちや体型、毛色・柄、髪型、目の形、耳や尻尾の形など)を保ちつつ、写真そのものではなく、LINEスタンプらしいシンプルな線画イラストに変換してください。肌や毛の質感、写真的な陰影など写実的な表現はそのまま残さないでください。
・[ここにイラストのタッチを指定してください(例: 2〜3頭身のデフォルメ・ちびキャラ風、フラットな塗りのアニメ調 など)]

【グリッド構成(区切り線は描かない)】
・画像全体を${rows}行×${cols}列(合計${count}マス)のマス目状に、均等な間隔を空けて配置してください。
・マスとマスの境界を示す罫線・グリッド線・仕切り線・枠線は絶対に描かないでください。背景は画像全体を通して継ぎ目のない1色の無地にし、マスの区切りが線や色の変化として見た目に分からないようにしてください(マス目はあくまで配置の目安で、あとで人間が座標を指定して均等に切り出すため、視覚的な境界線は不要です)。
・各マスの縦横比は約370:320(ヨコ:タテ ≒ 1.15:1)に近づけ、キャラクター同士の間隔が均等になるようにしてください。

【背景・色数(LINE審査対応)】
・背景は画像全体を通して、指定色「#5AFF19」(クロマキー用の鮮やかな黄緑色)の完全な無地にしてください。マスごとに背景色を変えたり、影・床面・グラデーション・色付きの装飾パネルなど単色以外の要素を追加したりしないでください。あとから背景だけを透過処理する前提です。
・キャラクターの配色は少ない色数のべた塗りを基本とし、細かいグラデーション・光沢・テクスチャ・ノイズは避けてください。LINEスタンプは縮小表示されるため、輪郭線をくっきり太めに描くと視認性が高まります。

【禁止事項】
・マス目を区切る罫線・グリッド線・仕切り線・枠線は一切描かないでください。

        }

        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            if (!ok) throw new Error("コピーに失敗しました");
        }

        function renderPromptText(pre, text) {
            const lines = text.split("\n");
            lines.forEach((line, i) => {
                if (/^・\[.*\]$/.test(line.trim())) {
                    const span = document.createElement("span");
                    span.className = "placeholder";
                    span.textContent = line;
                    pre.appendChild(span);
                } else {
                    pre.appendChild(document.createTextNode(line));
                }
                if (i < lines.length - 1) pre.appendChild(document.createTextNode("\n"));
            });
        }

        function buildPromptBlock(label, iconName, text) {
            const block = document.createElement("div");
            block.className = "prompt-block";

            const header = document.createElement("div");
            header.className = "prompt-block-header";

            const labelEl = document.createElement("div");
            labelEl.className = "prompt-block-label";
            labelEl.innerHTML = `<i data-lucide="${iconName}" class="icon"></i> ${label}`;

            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.innerHTML = '<i data-lucide="copy" class="icon"></i> コピー';

            let resetTimer = null;
            btn.addEventListener("click", async () => {
                try {
                    await copyText(text);
                    btn.classList.add("copied");
                    btn.innerHTML = '<i data-lucide="check" class="icon"></i> コピーしました';
                } catch (e) {
                    btn.innerHTML = '<i data-lucide="x" class="icon"></i> コピー失敗';
                }
                lucide.createIcons({ root: btn });
                if (resetTimer) clearTimeout(resetTimer);
                resetTimer = setTimeout(() => {
                    btn.classList.remove("copied");
                    btn.innerHTML = '<i data-lucide="copy" class="icon"></i> コピー';
                    lucide.createIcons({ root: btn });
                }, 1800);
            });

            header.appendChild(labelEl);
            header.appendChild(btn);

            const pre = document.createElement("pre");
            pre.className = "prompt-text";
            renderPromptText(pre, text);

            block.appendChild(header);
            block.appendChild(pre);
            return block;
        }

        function buildGridCard(rows, cols, count, note) {
            if (currentMode === "static" && [8, 16].includes(count)) {
                return window.buildNoTextPromptEditor(count, rows, cols, currentTextMode);
            }
            const card = document.createElement("div");
            card.className = "card grid-option";

            const title = document.createElement("h3");
            title.className = "step-title";
            title.innerHTML = `<i data-lucide="grid-3x3"></i> ${rows} × ${cols}(${rows}行 × ${cols}列)`;

            card.appendChild(title);

            const isWithText = currentTextMode === "with-text";

            if (currentMode === "static") {
                const label = isWithText
                    ? "スタンプ画像生成用プロンプト【文字あり】(顔・ペット等の写真を添付して使用)"
                    : "スタンプ画像生成用プロンプト【文字なし】(顔・ペット等の写真を添付して使用)";
                const prompt = isWithText
                    ? staticStampPromptWithText(rows, cols, count)
                    : staticStampPrompt(rows, cols, count);
                card.appendChild(buildPromptBlock(label, "image", prompt));
            } else {
                const label1 = isWithText
                    ? "① スタンプ画像生成用プロンプト【文字あり】(顔・ペット等の写真を添付して使用)"
                    : "① スタンプ画像生成用プロンプト【文字なし】(顔・ペット等の写真を添付して使用)";
                const prompt1 = isWithText
                    ? animationStampPromptWithText(rows, cols, count)
                    : animationStampPrompt(rows, cols, count);

                const label2 = isWithText
                    ? "② 動画生成用プロンプト【文字あり】(①で選んだイラストを添付してimage-to-video)"
                    : "② 動画生成用プロンプト【文字なし】(①で選んだイラストを添付してimage-to-video)";
                const prompt2 = isWithText
                    ? animationFlowPromptWithText(rows, cols, count)
                    : animationFlowPrompt(rows, cols, count);

                card.appendChild(buildPromptBlock(label1, "image", prompt1));
                card.appendChild(buildPromptBlock(label2, "video", prompt2));
            }

            return card;
        }

        function renderCountTabs() {
            const tabsWrap = document.getElementById("tabs");
            tabsWrap.innerHTML = "";
            const counts = MODES[currentMode].counts;
            if (!counts.includes(currentCount)) {
                currentCount = counts[0];
            }
            counts.forEach((c) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn${c === currentCount ? " active" : ""}`;
                btn.dataset.count = c;
                btn.disabled = [24, 32, 40].includes(c);
                btn.textContent = `${c}枚`;
                btn.addEventListener("click", () => {
                    currentCount = c;
                    tabsWrap.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    updatePanelDisplay();
                });
                tabsWrap.appendChild(btn);
            });
        }

        function renderPanels() {
            const panelsWrap = document.getElementById("panels");
            panelsWrap.innerHTML = "";
            const counts = MODES[currentMode].counts;
            const configs = MODES[currentMode].configs;

            counts.forEach((c) => {
                const panel = document.createElement("div");
                panel.className = "count-panel";
                panel.id = `panel-${c}`;
                panel.style.display = c === currentCount ? "flex" : "none";
                (configs[c] || []).forEach((cfg) => {
                    panel.appendChild(buildGridCard(cfg.rows, cfg.cols, c, cfg.note));
                });
                panelsWrap.appendChild(panel);
            });
        }

        function updatePanelDisplay() {
            document.querySelectorAll(".count-panel").forEach((p) => {
                p.style.display = "none";
            });
            const active = document.getElementById(`panel-${currentCount}`);
            if (active) active.style.display = "flex";
        }

                    ? staticMainImagePromptWithText()
                    : staticMainImagePrompt();
                promptsWrap.appendChild(buildPromptBlock(label, "image", prompt));
            } else {
                const label1 = isWithText
                    ? "① 代表イラスト生成用プロンプト【文字あり】(顔・ペット等の写真を添付して使用)"
                    : "① 代表イラスト生成用プロンプト【文字なし】(顔・ペット等の写真を添付して使用)";
                const prompt1 = isWithText
                    ? animationMainImagePromptWithText()
                    : animationMainImagePrompt();

                const label2 = isWithText
                    ? "② 動画生成用プロンプト【文字あり】(①のイラストを添付してimage-to-video)"
                    : "② 動画生成用プロンプト【文字なし】(①のイラストを添付してimage-to-video)";
                const prompt2 = isWithText
                    ? animationMainFlowPromptWithText()
                    : animationMainFlowPrompt();

                promptsWrap.appendChild(buildPromptBlock(label1, "image", prompt1));
                promptsWrap.appendChild(buildPromptBlock(label2, "video", prompt2));
            }
        }

        function switchTextMode(newTextMode) {
            currentTextMode = newTextMode;
            document.querySelectorAll(".text-option-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.textMode === newTextMode);
            });
            renderPanels();
            renderMainTabSection();
            lucide.createIcons();
        }

        function switchMode(newMode) {
            currentMode = newMode;
            document.querySelectorAll(".mode-tab-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.mode === newMode);
            });
            renderAboutSection();
            renderCountTabs();
            renderPanels();
            renderMainTabSection();
            lucide.createIcons();
        }

        document.querySelectorAll(".mode-tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                switchMode(btn.dataset.mode);
            });
        });

        document.querySelectorAll(".text-option-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                switchTextMode(btn.dataset.textMode);
            });
        });

        switchMode("static");

    })();
    </script>
